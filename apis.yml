name: Betdex
description: 'Betdex Labs is the team behind BetDEX, a decentralized sports betting
  exchange, and the Monaco Protocol — an open-source, permissionless liquidity and
  betting-exchange protocol built on the Solana blockchain. Rather than a traditional
  REST API, Betdex exposes an on-chain integration surface: Solana programs plus first-party
  TypeScript client libraries (@monaco-protocol/client and @monaco-protocol/admin-client
  on npm) that let developers create markets, place and match orders, and settle outcomes
  directly against the protocol. Developer resources are published at betdex.com/developers
  with source under the MonacoProtocol GitHub organization.'
